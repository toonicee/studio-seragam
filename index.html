<style>
/* Layout: meja kerja penjahit — panggung 3D di atas kertas pola (kiri), lembar spesifikasi (kanan) ditutup pita meteran berisi total; bertumpuk di ponsel */
:root {
  --paper: #e8ecee;
  --sheet: #fbfcfc;
  --sheet-2: #f0f3f5;
  --ink: #17202a;
  --ink-2: #4d5a66;
  --ink-3: #74808b;
  --line: #d2d9de;
  --grid: rgba(36, 62, 84, .065);
  --grid-2: rgba(36, 62, 84, .12);
  --stage: #e1e7ea;
  --tag: #fffdf7;
  --tape: #f2c42c;
  --tape-ink: #1f1a07;
  --chalk: #2f5bd0;
  --ok: #1b7a45;
  --ok-bg: #dcf0e3;
  --warn: #9c4507;
  --warn-bg: #fbe6d3;
  --shadow: 0 1px 2px rgba(20, 30, 40, .07), 0 10px 28px rgba(20, 30, 40, .09);
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1316; --sheet: #171c20; --sheet-2: #1e2429; --ink: #e6eaed; --ink-2: #a5b0ba; --ink-3: #7b8792;
    --line: #2b333a; --grid: rgba(190, 210, 225, .045); --grid-2: rgba(190, 210, 225, .085); --stage: #151a1e; --tag: #20262b;
    --tape: #f2c42c; --tape-ink: #1f1a07; --chalk: #8aa8ff; --ok: #5cc98c; --ok-bg: #173226; --warn: #f2a35c; --warn-bg: #3a2614;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1316; --sheet: #171c20; --sheet-2: #1e2429; --ink: #e6eaed; --ink-2: #a5b0ba; --ink-3: #7b8792;
  --line: #2b333a; --grid: rgba(190, 210, 225, .045); --grid-2: rgba(190, 210, 225, .085); --stage: #151a1e; --tag: #20262b;
  --tape: #f2c42c; --tape-ink: #1f1a07; --chalk: #8aa8ff; --ok: #5cc98c; --ok-bg: #173226; --warn: #f2a35c; --warn-bg: #3a2614;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 440px;
  gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- stage ---------- */
.stage {
  position: relative; min-height: 0; overflow: hidden;
  border: 1px solid var(--line); border-radius: 16px;
  background-color: var(--stage);
  background-image:
    linear-gradient(var(--grid-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-2) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px;
  background-position: center center;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.tag {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  display: grid; gap: 1px;
  padding: 11px 16px 12px 34px;
  background: var(--tag); border: 1px solid var(--line);
  clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  box-shadow: var(--shadow);
  max-width: min(300px, calc(100% - 28px));
  pointer-events: none;
}
.tag::before { content: ""; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: var(--stage); }
.tag-kicker { font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tag-name { font: 700 23px/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.tag-mat { font-size: 13px; color: var(--ink-2); }
.tag-price { margin-top: 4px; font: 500 14px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.tag-price s { color: var(--ink-3); font-size: 12px; margin-right: 4px; }
.tag-price small { color: var(--ink-3); font-size: 11px; }

.views {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 2px; padding: 3px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
}
.views button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px;
  font: 600 13px/1 var(--f-body); color: var(--ink-2); white-space: nowrap;
}
.views button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.views button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--sheet-2); color: var(--ink); }
.views button:disabled { opacity: .4; cursor: not-allowed; }
.hint { position: absolute; right: 16px; bottom: 20px; margin: 0; font-size: 12px; color: var(--ink-3); pointer-events: none; }
.stage-msg {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
  font: 500 14px/1.5 var(--f-mono); color: var(--ink-2); pointer-events: none;
}

/* ---------- panel ---------- */
.panel {
  min-height: 0; display: flex; flex-direction: column;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); background: var(--sheet); flex: none; }
.tabs button {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  border: 0; background: transparent; padding: 14px 6px 12px;
  font: 600 14px/1 var(--f-body); color: var(--ink-3);
  border-bottom: 3px solid transparent;
}
.tabs button span {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  font: 500 11px/1 var(--f-mono); border: 1px solid currentColor;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button[aria-selected="true"] span { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.tabpanel { padding: 20px 20px 28px; display: grid; gap: 26px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.h { margin: 0; font: 700 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.lbl { margin: 0; font: 600 12px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.note { margin: 0; font-size: 13px; color: var(--ink-2); }
.note b { color: var(--ink); }
.callout { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }

/* product cards */
.prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prod {
  display: grid; gap: 2px; justify-items: start; text-align: left;
  padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet);
}
.prod svg { width: 40px; height: 40px; color: var(--ink-2); margin-bottom: 4px; }
.prod-name { font: 700 17px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.prod-meta { font-size: 12.5px; color: var(--ink-2); }
.prod-meta b { font: 500 12.5px var(--f-mono); color: var(--ink); }
.prod-min { font: 500 11px/1.3 var(--f-mono); color: var(--ink-3); }
.prod:hover { border-color: var(--ink-3); }
.prod-grid .prod:last-child:nth-child(odd) { grid-column: 1 / -1; }
.prod[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--sheet-2); }
.prod[aria-pressed="true"] svg { color: var(--ink); }

.mats { display: grid; gap: 8px; }
.mat {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 9px 12px 9px 9px; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet);
}
.mat .sw { width: 44px; height: 44px; border-radius: 8px; background-size: cover; border: 1px solid var(--line); }
.mat-name { font-weight: 600; line-height: 1.25; }
.mat-name small { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
.mat-price { display: grid; justify-items: end; font: 500 14px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; }
.mat-price s { font-size: 11.5px; color: var(--ink-3); }
.mat:hover { border-color: var(--ink-3); }
.mat[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--sheet-2); }

.incl { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.incl li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: 14px; }
.incl svg { width: 18px; height: 18px; margin-top: 2px; color: var(--ok); }

/* patterns */
.pat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pat-group { margin-top: 4px; }
.pat {
  display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left;
  padding: 8px 10px 8px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet);
}
.pat svg { width: 46px; height: 40px; }
.pat b { display: block; font-size: 13.5px; line-height: 1.2; }
.pat small { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.25; }
.pat[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--sheet-2); }

/* swatches */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw-btn {
  position: relative; width: 30px; height: 30px; border-radius: 50%; padding: 0;
  border: 1px solid rgba(0, 0, 0, .18); background: var(--c);
}
.sw-btn[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--ink); }
.swatches.sm .sw-btn { width: 24px; height: 24px; }
.sw-auto { background: conic-gradient(#f4f4f0 0 50%, #1b2129 0 100%); }
.sw-custom { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1px dashed var(--ink-3); position: relative; overflow: hidden; color: var(--ink-2); }
.sw-custom input { position: absolute; inset: -6px; width: 44px; height: 44px; opacity: 0; cursor: pointer; }
.sw-custom svg { width: 14px; height: 14px; pointer-events: none; }
.color-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.color-name { font: 500 12.5px var(--f-mono); color: var(--ink-2); }

/* logo + slots */
.logo-box { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center; }
.logo-thumb {
  width: 88px; height: 88px; border-radius: 12px; border: 1px solid var(--line);
  background-color: var(--sheet-2);
  background-image: linear-gradient(45deg, var(--grid-2) 25%, transparent 25%, transparent 75%, var(--grid-2) 75%), linear-gradient(45deg, var(--grid-2) 25%, transparent 25%, transparent 75%, var(--grid-2) 75%);
  background-size: 12px 12px; background-position: 0 0, 6px 6px;
  display: grid; place-items: center; overflow: hidden;
}
.logo-thumb img { max-width: 76px; max-height: 76px; }
.logo-actions { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-ink, .btn-line {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; line-height: 1.1; white-space: nowrap;
}
.btn-ink { background: var(--ink); color: var(--sheet); border: 1px solid var(--ink); }
.btn-ink:hover { opacity: .9; }
.btn-line { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); }
.btn-line:hover { border-color: var(--ink-3); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
input[type="file"].vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.finish { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sheet-2); font-size: 13px; color: var(--ink-2); }
.finish b { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; padding: 5px 8px; border-radius: 6px; background: var(--ink); color: var(--sheet); white-space: nowrap; }

.slots { display: grid; gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
.slot-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.slot-head div { min-width: 0; }
.slot-head b { display: block; font: 700 17px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.slot-head small { display: block; font-size: 12px; color: var(--ink-3); }
.slot-body { display: grid; gap: 12px; padding: 2px 14px 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.slot.off .slot-body { display: none; }
.switch { position: relative; flex: none; width: 38px; height: 22px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--ink); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--chalk); outline-offset: 2px; }

.fld { display: grid; gap: 5px; min-width: 0; }
.fld > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fld input[type="text"], .fld input[type="number"], .fld textarea, .fld select {
  width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--sheet);
}
.fld textarea { resize: vertical; min-height: 64px; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--ink-3); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--chalk) 22%, transparent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input[type="range"] { width: 100%; accent-color: var(--ink); }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 17px; height: 17px; accent-color: var(--ink); margin: 0; }

.extra-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.extra-thumb { display: inline-grid; place-items: center; width: 64px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet-2); overflow: hidden; }
.extra-thumb img { max-width: 58px; max-height: 30px; }
small.note { font-size: 12px; }

/* order */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.sizes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sizes th, .sizes td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sizes th:first-child, .sizes td:first-child { padding-left: 12px; }
.sizes td:last-child, .sizes th:last-child { padding-right: 10px; }
.sizes thead th { font: 600 11.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); background: var(--sheet-2); }
.sizes tbody th { font: 700 17px/1 var(--f-display); letter-spacing: .02em; }
.sizes td { font: 400 12.5px var(--f-mono); color: var(--ink-2); }
.sizes tfoot th, .sizes tfoot td { border-bottom: 0; font-weight: 600; color: var(--ink); }
.sizes tfoot td { font: 600 14px var(--f-mono); padding-left: 34px; }
.sizes tr.rec th, .sizes tr.rec td { background: color-mix(in srgb, var(--tape) 26%, transparent); }
.sizes tr.rec th::after { content: "saran"; margin-left: 6px; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; padding: 3px 5px; border-radius: 4px; background: var(--tape); color: var(--tape-ink); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--sheet); }
.step button { width: 26px; height: 32px; border: 0; background: transparent; font-size: 17px; line-height: 1; color: var(--ink-2); }
.step button:hover { background: var(--sheet-2); color: var(--ink); }
.step input { width: 38px; height: 32px; border: 0; border-inline: 1px solid var(--line); text-align: center; font: 500 14px var(--f-mono); background: var(--sheet); -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.rec-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.rec-fields .fld > span { font-size: 12px; }
.rec-out {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--tape) 22%, var(--sheet));
  font-size: 13px; line-height: 1.4; color: var(--ink-2);
}
.rec-out b { color: var(--ink); }
.rec-big {
  display: inline-grid; place-items: center; min-width: 52px; height: 52px; padding: 0 8px; border-radius: 10px;
  background: var(--tape); color: var(--tape-ink); font: 700 26px/1 var(--f-display); letter-spacing: .02em;
}

dl.price { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 14px; }
dl.price dt { color: var(--ink-2); }
dl.price dd { margin: 0; text-align: right; font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; }
dl.price .tot { padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 600; }
dl.price dd.tot { font: 700 24px/1 var(--f-display); letter-spacing: .01em; }
dl.price .save { color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* tape footer */
.tape {
  position: relative; flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 16px 13px 18px;
  background: var(--tape); color: var(--tape-ink);
}
.tape::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 11px; opacity: .8;
  background-image:
    repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 8px);
  background-size: 100% 11px, 100% 5px; background-repeat: no-repeat;
}
.tape-info { display: grid; gap: 1px; min-width: 0; }
.tape-qty { font: 500 12px/1.2 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.tape-total { font: 700 28px/1 var(--f-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.tape-status { font-size: 12.5px; font-weight: 600; }

.dlg-in { display: grid; gap: 16px; padding: 20px; }

}
.shots figcaption { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
#summary { width: 100%; min-height: 200px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet-2); font: 400 12.5px/1.55 var(--f-mono); resize: vertical; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 20;

  padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--sheet); font-size: 14px; font-weight: 600;

function sizeByWeight(kg) {
  const avail = curP().sizes.map(s => s[0]);
  let i = SIZE_ORDER.findIndex(z => kg < WEIGHT_GUIDE[z][1]);
  if (i < 0) return { over: true };
  while (i < SIZE_ORDER.length && !avail.includes(SIZE_ORDER[i])) i++;

let fitDist = 4.6;
function resize() {
  if (!renderer) return;
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (w / h < 1) camera.setViewOffset(w, h, 0, -h * 0.075, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  fitDist = Math.max(1.95 / (2 * tanH), 1.65 / (2 * tanH * camera.aspect)) + 0.25;
  if (!resize.done) { setView('front', true); resize.done = true; }
  if (cur.T) buildMeasure();
  needsRender = true;
}

function setView(v, instant = false) {
  if (!camera) return;
  const dir = new THREE.Vector3(...VIEWS[v]).normalize();
  const to = controls.target.clone().addScaledVector(dir, fitDist);
  setViewPressed(v);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) { camera.position.copy(to); camAnim = null; controls.update(); needsRender = true; return; }
  const from = camera.position.clone().sub(controls.target);
  const toRel = to.clone().sub(controls.target);
  const s0 = new THREE.Spherical().setFromVector3(from), s1 = new THREE.Spherical().setFromVector3(toRel);
  let dT = s1.theta - s0.theta; if (dT > Math.PI) dT -= TAU; if (dT < -Math.PI) dT += TAU;

}

  let y = cy - totalH * pxV / 2;

  if (logo) { drawImageSlot(logo, cx - lw * pxU / 2, y, lw * pxU, lh * pxV, bordir); y += (lh + gap) * pxV; }
  for (const line of lines) {
    let fpx = th * pxV;
    const my = y + th * 1.3 * pxV / 2;
    ctx.save(); ctx.translate(cx, my); ctx.scale(ax, 1);
    ctx.font = FONTS[s.font].css(fpx); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const maxW = d.maxW * k * pxU / ax, mw = ctx.measureText(line).width;
    if (mw > maxW) { fpx *= maxW / mw; ctx.font = FONTS[s.font].css(fpx); }
    if (bordir) { ctx.shadowColor = 'rgba(0,0,0,.32)'; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1.6; ctx.shadowBlur = 1.5; ctx.fillStyle = satinPattern(ctx, color); }
    else ctx.fillStyle = color;
    ctx.fillText(line, 0, 0);
    ctx.restore();
    if (bordir) {
      b.save(); b.translate(cx, my); b.scale(ax, 1);
      b.font = FONTS[s.font].css(fpx); b.textAlign = 'center'; b.textBaseline = 'middle';
      b.shadowColor = 'rgba(255,255,255,.6)'; b.shadowBlur = 2; b.fillStyle = '#ffffff'; b.fillText(line, 0, 0); b.restore();
    }
    y += th * 1.3 * pxV;
  }
  if (lines.length && extra) y += gap * pxV;
  if (extra) drawImageSlot(extra, cx - ew * pxU / 2, y, ew * pxU, eh * pxV, bordir);
}

/* ---------- loop ---------- */
function loop(now) {
  requestAnimationFrame(loop);
  if (!three3d || document.hidden) return;
  if (camAnim) {
    const f = clamp((now - camAnim.t0) / camAnim.dur, 0, 1), e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
    const sp = new THREE.Spherical(lerp(camAnim.s0.radius, camAnim.s1.radius, e), lerp(camAnim.s0.phi, camAnim.s1.phi, e), camAnim.s0.theta + camAnim.dT * e);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp));
    if (f >= 1) camAnim = null;
    needsRender = true;
  }
  const moved = controls.update();
  if (moved || needsRender) { renderer.render(scene, camera); needsRender = false; }
}

function snapshot(view) {
  const w = 880, h = 1100;
  const prevPos = camera.position.clone();
  const size = renderer.getSize(new THREE.Vector2()), pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.clearViewOffset(); camera.updateProjectionMatrix();
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(1.95 / (2 * tanH), 1.65 / (2 * tanH * camera.aspect)) + 0.2;
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(...VIEWS[view]).normalize(), dist);
  camera.lookAt(controls.target);
  // gambar mockup selalu bersih, tanpa garis ukuran
  if (measureGroup) measureGroup.visible = false;
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  if (measureGroup) measureGroup.visible = true;
  renderer.setPixelRatio(pr); renderer.setSize(size.x, size.y, false);
  camera.position.copy(prevPos); camera.lookAt(controls.target);
  resize();
  return url;
}
function openMockup() {
  $('#summary').value = summaryText();
  if (three3d) { $('#shotFront').src = snapshot('front'); $('#shotBack').src = snapshot('back'); }
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function onChange(kind) {
  if (three3d) {
    if (kind === 'geom') buildShirt();
    else if (kind === 'weave') applyWeave();
    else if (kind === 'paint') paintAll();
  }
  renderTag(); renderTape(); save();
}
let paintRaf = 0;
function schedulePaint() { cancelAnimationFrame(paintRaf); paintRaf = requestAnimationFrame(() => paintAll()); save(); }

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  document.querySelectorAll('.tabpanel').forEach(p => { p.hidden = p.id !== 'panel-' + b.dataset.tab; });
  const sc = $('#scroll'); if (sc.scrollHeight > sc.clientHeight) sc.scrollTop = 0;
  try { localStorage.setItem(STORE_KEY + ':tab', b.dataset.tab); } catch (err) {}
});
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const tabs = [...document.querySelectorAll('.tabs [data-tab]')], i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]; n.focus(); n.click();
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'product') {
    if (state.product === el.dataset.id) return;
    state.product = el.dataset.id; renderAll(); onChange('geom');
  } else if (a === 'material') {
    state.material[state.product] = el.dataset.id; renderModel(); onChange('weave');
  } else if (a === 'pattern') {
    // warna tetap (bawaan: oranye katalog); warna foto contoh hanya lewat tombol "Pakai warna seperti contoh"
    look().pattern = el.dataset.id;
    renderWarna(); onChange('paint');
  } else if (a === 'sample-look') {
    Object.assign(look(), SAMPLE_LOOKS[look().pattern] || {}); renderWarna(); renderModel(); onChange('paint');
  } else if (a === 'color') {
    const t = el.dataset.target, hex = el.dataset.hex;
    if (t.startsWith('thread:')) { state.slots[t.slice(7)].color = hex; el.closest('.swatches').querySelectorAll('.sw-btn').forEach(x => x.setAttribute('aria-pressed', String(x === el))); schedulePaint(); return; }
    look()[t] = hex; renderWarna(); if (t === 'body') renderModel();
    onChange('paint');
  } else if (a === 'pocket-count') {
    const n = +el.dataset.id; if ((state.pocketCount[state.product] || 2) === n) return;
    state.pocketCount[state.product] = n; renderModel(); onChange('geom');
  } else if (a === 'sleeve-style') {
    if (state.sleeveStyle === el.dataset.id) return;
    state.sleeveStyle = el.dataset.id; renderModel(); onChange('geom');
  } else if (a === 'layout-catalog') {
    // tata letak persis mockup: logo dada kiri, nama dada kanan, punggung logo + website (+ gambar tambahan bila ada)
    const extra = state.slots.punggung.extraSrc;
    state.slots = structuredClone(DEFAULT_STATE.slots); state.slots.punggung.extraSrc = extra;
    state.slotOn = structuredClone(DEFAULT_STATE.slotOn);
    renderLogo(); onChange('paint'); toast('Posisi logo & teks mengikuti katalog');
  } else if (a === 'look-reset') {
    state.look[state.product] = structuredClone(DEFAULT_STATE.look[state.product]); renderWarna(); renderModel(); onChange('paint');
  } else if (a === 'qty') {
    const z = el.dataset.size, q = qtyMap(); q[z] = Math.max(0, (+q[z] || 0) + (+el.dataset.d)); const inp = document.getElementById('q-' + z); if (inp) inp.value = q[z];
    onChange('price');
  } else if (a === 'copy') copySummary();
  else if (a === 'mockup') openMockup();
  else if (a === 'logo-reset') { state.logoSrc = null; userLogo = null; renderLogo(); onChange('paint'); }
  else if (a === 'extra-remove') { state.slots.punggung.extraSrc = null; extraImg = null; renderLogo(); onChange('paint'); }
});
document.addEventListener('input', e => {
  const el = e.target, bind = el.dataset && el.dataset.bind; if (!bind) return;
  if (bind === 'body' || bind === 'accent' || bind === 'accent2') {
    look()[bind] = el.value; const row = el.closest('.sec'); row.querySelectorAll('.sw-btn').forEach(x => x.setAttribute('aria-pressed', 'false'));
    const nm = row.querySelector('.color-name'); if (nm) nm.textContent = colorName(el.value);
    schedulePaint();
  } else if (bind === 'slot') {
    const s = state.slots[el.dataset.slot], key = el.dataset.key;
    s[key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
    schedulePaint();
  } else if (bind === 'slotOn') {
    state.slotOn[state.product][el.dataset.slot] = el.checked;
    el.closest('.slot').classList.toggle('off', !el.checked); schedulePaint();
  } else if (bind === 'qty') {
    qtyMap()[el.dataset.size] = Math.max(0, Math.floor(+el.value || 0)); renderTape(); save();
  } else if (bind === 'fit') {
    state[el.dataset.key] = el.value; const rec = recommendSize();
    $('#recOut').innerHTML = recText(rec);
    document.querySelectorAll('[data-size-row]').forEach(r => r.classList.toggle('rec', !!rec && rec.size === r.dataset.sizeRow));
    buildMeasure(); save();
  } else if (bind === 'customer') { state.customer[el.dataset.key] = el.value; save(); }
  else if (bind === 'vestFlag') { state.vestFlag = el.checked; schedulePaint(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if ((el.id === 'logoFile' || el.id === 'extraFile') && el.files && el.files[0]) {
    const f = el.files[0];
    if (f.size > 8 * 1024 * 1024) { toast('File terlalu besar. Maksimal 8 MB.'); return; }
    const url = await readFile(f);
    if (el.id === 'logoFile') state.logoSrc = url; else state.slots.punggung.extraSrc = url;
    await loadImages(); renderLogo(); onChange('paint');
    toast(el.id === 'logoFile' ? 'Logo dipasang di semua posisi' : 'Gambar tambahan dipasang di punggung');
  } else if (el.dataset && el.dataset.bind === 'removeWhite') {
    state.removeWhite = el.checked; await loadImages(); renderLogo(); onChange('paint');
  } else if (el.dataset && (el.dataset.bind === 'body' || el.dataset.bind === 'accent' || el.dataset.bind === 'accent2')) {
    renderWarna(); if (el.dataset.bind === 'body') renderModel(); save();
  }
});
document.querySelectorAll('.views [data-view]').forEach(b => b.addEventListener('click', () => { if (controls) controls.autoRotate = false; $('#spinBtn').setAttribute('aria-pressed', 'false'); setView(b.dataset.view); }));
$('#measureBtn').addEventListener('click', () => { state.measureOn = !state.measureOn; buildMeasure(); save(); });
$('#spinBtn').addEventListener('click', e => {
  if (!controls) return; controls.autoRotate = !controls.autoRotate;
  e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); if (controls.autoRotate) setViewPressed(null); needsRender = true;
});
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* =====================================================================
   START
   ===================================================================== */
await loadImages();
renderAll();
try { const tab = localStorage.getItem(STORE_KEY + ':tab'); if (tab) document.querySelector(`.tabs [data-tab="${tab}"]`)?.click(); } catch (e) {}
try {
  init3D();
  buildShirt();
  $('#stageMsg').hidden = true;
  requestAnimationFrame(loop);
} catch (err) {
  console.error(err);
  $('#stageMsg').textContent = 'Pratinjau 3D tidak bisa dimuat di browser ini (WebGL tidak tersedia). Pengaturan dan kalkulator order tetap bisa dipakai.';
}
try {
  await Promise.race([
    Promise.all(['700 40px "Barlow Condensed"', '600 40px "Barlow Condensed"', '700 40px "Roboto Slab"', '700 40px "Dancing Script"'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 3000)),
  ]);
} catch (e) {}
placeholderCache.clear();
renderLogo();
paintAll();
buildMeasure(true);
</script>
