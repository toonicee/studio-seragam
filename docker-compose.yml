# Jalankan di VPS: docker compose up -d --build
# Isi .env dulu (salin dari .env.example). SHOP_DOMAIN harus sudah mengarah ke IP VPS.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      ORIGIN: https://${SHOP_DOMAIN}
      BODY_SIZE_LIMIT: 10M
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    volumes:
      - shop-data:/data
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shop-data:
  caddy-data:
  caddy-config:
